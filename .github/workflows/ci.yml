name: CI

# Runs the plugin tests (MiniTest, unit + functional) against every currently
# supported Redmine version in a clean environment. For each matrix entry
# Redmine is checked out fresh, the plugin is copied in, an empty database is
# migrated, and `redmine:plugins:test` is started. MariaDB runs on every
# version; MySQL and PostgreSQL on the oldest and the newest, which catches SQL
# only one of them accepts.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel older runs of the same branch/PR as soon as a new one starts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Redmine ${{ matrix.redmine }} · Ruby ${{ matrix.ruby }} · ${{ matrix.db }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { redmine: '5.1-stable', ruby: '3.2', db: 'mariadb' }
          - { redmine: '6.0-stable', ruby: '3.3', db: 'mariadb' }
          - { redmine: '6.1-stable', ruby: '3.3', db: 'mariadb' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'mariadb' }
          - { redmine: '5.1-stable', ruby: '3.2', db: 'mysql' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'mysql' }
          - { redmine: '5.1-stable', ruby: '3.2', db: 'postgresql' }
          - { redmine: '7.0-stable', ruby: '3.4', db: 'postgresql' }

    env:
      RAILS_ENV: test
      # Redmine reads config/database.yml during `bundle install` already, to
      # pick the DB adapter (mysql2 / pg) - hence writing it before the bundle below.
      REDMINE_DIR: redmine


    steps:
      # 1. Check out Redmine core at the matching stable version.
      - name: Checkout Redmine ${{ matrix.redmine }}
        uses: actions/checkout@v4
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}
          path: ${{ env.REDMINE_DIR }}

      # 2. Put this plugin into Redmine's plugin folder.
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: ${{ env.REDMINE_DIR }}/plugins/redmine_expert_metrics

      # 3. Native dependencies for mysql2 / pg (and rmagick, if in the bundle).
      #    The runner image ships a Google Chrome apt source we have no use for;
      #    whenever its index is broken (`Hash Sum mismatch`) it takes the whole
      #    `apt-get update` down with it, so drop it before refreshing the lists.
      - name: Install system packages
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google-chrome*.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev libpq-dev libmagickwand-dev imagemagick pkg-config

      # The database of this matrix entry, started here rather than as a service
      # container so each entry gets only the one it tests. Docker runs the health
      # check; the loop only reads its result.
      - name: Start ${{ matrix.db }}
        run: |
          health='--health-interval=3s --health-timeout=5s --health-retries=60'
          case "${{ matrix.db }}" in
            mariadb)
              docker run -d --name db -p 3306:3306 -e MARIADB_ROOT_PASSWORD=root -e MARIADB_DATABASE=redmine_test \
                --health-cmd='healthcheck.sh --connect --innodb_initialized' $health mariadb:11.4 ;;
            mysql)
              # Over TCP: the server of the image's init phase listens on the socket only.
              docker run -d --name db -p 3306:3306 -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=redmine_test \
                --health-cmd='mysqladmin ping -h 127.0.0.1 -uroot -proot --silent' $health mysql:8.4 ;;
            postgresql)
              # Over TCP for the same reason.
              docker run -d --name db -p 5432:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=redmine_test \
                --health-cmd='pg_isready -h 127.0.0.1 -U postgres' $health postgres:17 ;;
          esac
          for i in $(seq 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ] && exit 0
            sleep 2
          done
          docker logs db; exit 1

      # 4. Set up Ruby (the bundle cache keys off Redmine ref + Ruby version).
      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      # 5. Configure the test database (MySQL/MariaDB with utf8mb4 and READ-COMMITTED
      #    as recommended by Redmine, PostgreSQL with utf8). Has to exist before
      #    `bundle install`.
      - name: Write database.yml
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          if [ "${{ matrix.db }}" = postgresql ]; then
            cat > config/database.yml <<'YML'
          test:
            adapter: postgresql
            database: redmine_test
            host: 127.0.0.1
            port: 5432
            username: postgres
            password: postgres
            encoding: utf8
          YML
          else
            cat > config/database.yml <<'YML'
          test:
            adapter: mysql2
            database: redmine_test
            host: 127.0.0.1
            port: 3306
            username: root
            password: root
            encoding: utf8mb4
            variables:
              transaction_isolation: "READ-COMMITTED"
          YML
          fi

      # Native gems (mysql2, rmagick) link against the runner's system libraries, so a
      # bundle cached on an older runner image fails to load (libmysqlclient.so.21 was
      # gone after the image update in 2026-11). Key the cache on the image as well.
      - name: Runner image version
        run: echo "RUNNER_IMAGE=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # 6. Cache gems (Redmine ships no Gemfile.lock, so the key uses the ref).
      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: ${{ env.REDMINE_DIR }}/vendor/bundle
          key: gems-${{ env.RUNNER_IMAGE }}-${{ matrix.redmine }}-ruby${{ matrix.ruby }}-${{ matrix.db }}-${{ hashFiles(format('{0}/Gemfile', env.REDMINE_DIR)) }}
          restore-keys: |
            gems-${{ env.RUNNER_IMAGE }}-${{ matrix.redmine }}-ruby${{ matrix.ruby }}-${{ matrix.db }}-

      # 7. Install gems (without the development group; the test group is needed).
      - name: Install gems
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          bundle config set --local path vendor/bundle
          bundle config set --local without 'development'
          bundle install --jobs 4 --retry 3

      # 8. Build a clean environment: secret token, core migrations, then the
      #    plugin migration (the counter table).
      - name: Prepare Redmine
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          bundle exec rake generate_secret_token
          bundle exec rake db:create db:migrate
          bundle exec rake redmine:plugins:migrate NAME=redmine_expert_metrics

      # 9. Run the plugin tests (unit + functional).
      - name: Run plugin tests
        working-directory: ${{ env.REDMINE_DIR }}
        run: bundle exec rake redmine:plugins:test NAME=redmine_expert_metrics

      # An integration test that gets a 500 only reports the status; the exception
      # behind it is in the test log, after the request id ("[uuid] Foo::Error (...)").
      - name: Exceptions from the test log
        if: failure()
        working-directory: ${{ env.REDMINE_DIR }}
        run: |
          grep -n -A 12 -E '[A-Z][A-Za-z]+(::[A-Z][A-Za-z]+)*(Error|Invalid|Exception) \(' \
            log/test.log | head -n 400 || true
