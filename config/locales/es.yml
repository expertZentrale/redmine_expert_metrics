es:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Usuarios activos"
  text_expert_metrics_intro: "Usuarios que enviaron al menos una solicitud en los últimos %{minutes} minutos. La lista se basa en los tokens de sesión de Redmine, por lo que las solicitudes con clave de API y la recuperación de correo no cuentan: esas aparecen en Uso de la API. Consúltela antes de un mantenimiento para ver si alguien sigue trabajando."
  label_expert_metrics_active_last: "Activos en los últimos %{window}"
  label_expert_metrics_sessions_total: "Sesiones iniciadas"
  label_expert_metrics_recent_logins: "Inicios de sesión en las últimas 24 h"
  label_expert_metrics_collected_at: "Actualizado"
  label_expert_metrics_refresh: "Actualizar"
  label_expert_metrics_prometheus: "Métricas de Prometheus"
  field_expert_metrics_last_activity: "Última actividad"
  field_expert_metrics_session_since: "Sesión iniciada desde"
  field_expert_metrics_sessions: "Sesiones"
  label_expert_metrics_minutes_ago:
    zero: "ahora mismo"
    one: "hace 1 min"
    other: "hace %{count} min"
  label_expert_metrics_api_usage: "Uso de la API"
  text_expert_metrics_api_usage_intro: "Solicitudes autenticadas con credenciales de API (clave de API, HTTP Basic, OAuth), por usuario. Redmine no lleva ningún registro de esto; el plugin las cuenta por día, verbo HTTP y cliente (User-Agent), y guarda la última dirección IP y la última ruta. Los datos con más de %{days} días se borran."
  text_expert_metrics_api_disabled: "La API REST está desactivada (Administración » Configuración » API), por lo que no se acepta ni se registra ninguna solicitud de API."
  text_expert_metrics_api_not_migrated: "Falta la migración del plugin: ejecute rake redmine:plugins:migrate para registrar el uso de la API."
  label_expert_metrics_api_period: "Periodo"
  label_expert_metrics_api_days:
    one: "hoy"
    other: "%{count} días"
  label_expert_metrics_api_users: "Usuarios con solicitudes de API"
  label_expert_metrics_api_requests: "Solicitudes de API"
  label_expert_metrics_api_writes: "De ellas, de escritura (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Usuarios con clave de API"
  label_expert_metrics_unused_keys: "Claves de API no usadas en este periodo (las solicitudes con contraseña y OAuth no usan la clave)"
  label_expert_metrics_time_ago: "hace %{time}"
  label_expert_metrics_no_user_agent: "(sin User-Agent)"
  label_expert_metrics_more_clients:
    one: "1 cliente más"
    other: "%{count} clientes más"
  label_expert_metrics_switched_to: "como %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "Clave de API"
  label_expert_metrics_auth_key_hint: "Cabecera X-Redmine-API-Key o parámetro key"
  label_expert_metrics_auth_basic: "Clave de API (Basic)"
  label_expert_metrics_auth_basic_hint: "Clave de API como nombre de usuario de HTTP Basic"
  label_expert_metrics_auth_password: "Contraseña"
  label_expert_metrics_auth_password_hint: "Usuario y contraseña mediante HTTP Basic: el script guarda una contraseña; es preferible una clave de API"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "Token de acceso OAuth"
  field_expert_metrics_last_used: "Último uso"
  field_expert_metrics_requests: "Solicitudes"
  field_expert_metrics_writes: "Escritura"
  field_expert_metrics_auth: "Autenticación"
  field_expert_metrics_clients: "Clientes"
  field_expert_metrics_last_ip: "Última IP"
  field_expert_metrics_last_path: "Última ruta"
  field_expert_metrics_key_created_on: "Clave de API creada"
  label_expert_metrics_api_usage_enabled: "Registrar el uso de la API"
  text_expert_metrics_api_usage_enabled: "Registra cada solicitud autenticada con credenciales de API (por día, usuario, método, autenticación y cliente, con la última dirección IP y ruta; se conserva 90 días) y añade las series de API a /metrics. Desactivado: sin escrituras adicionales en la base de datos por cada solicitud de API y sin consultas de API en /metrics."
  text_expert_metrics_api_usage_off: "El registro está desactivado (opción del plugin «Registrar el uso de la API»): la página muestra lo que se registró mientras estaba activado."
  label_expert_metrics_performance_enabled: "Registrar métricas de rendimiento"
  text_expert_metrics_performance_enabled: "Mide el tiempo de cada solicitud por controlador y acción (base de datos, vistas, hooks de plugins, sentencias SQL), de los trabajos en segundo plano, y la memoria y la recolección de basura de cada proceso de Redmine, y añade estas series a /metrics. Se guardan en la memoria de cada proceso, por lo que Prometheus debe recopilar las métricas de cada pod y los paneles las suman con sum. Los administradores reciben además una cabecera Server-Timing que pueden consultar en las herramientas de desarrollo del navegador. Desactivado: sin trabajo adicional por solicitud."
  label_expert_metrics_slow_request_threshold: "Umbral de solicitud lenta"
  text_expert_metrics_slow_request_threshold: "Las solicitudes que tardan al menos este tiempo se guardan con su desglose (las sentencias SQL más lentas, sin valores, y los listeners de hooks más lentos) y aparecen en Solicitudes lentas; se conservan %{days} días, como máximo 30 por proceso y minuto. 0 guarda todas las solicitudes: solo para mediciones cortas."
  label_expert_metrics_slow_requests_token: "Token de solicitudes lentas"
  text_expert_metrics_slow_requests_token: "Permite que un script lea las solicitudes lentas sin una cuenta de administrador: GET /admin/slow_requests.json con la cabecera \"Authorization: Bearer <token>\". Al menos %{length} caracteres, por ejemplo de openssl rand -hex 32; vacío lo desactiva. No abre nada más, pero el JSON muestra usuarios y rutas: guarde el token como una contraseña."
  text_expert_metrics_slow_requests_token_too_short: "Menos de %{length} caracteres: se ignora, el token está desactivado."
  label_expert_metrics_slow_requests: "Solicitudes lentas"
  text_expert_metrics_slow_requests_intro: "Solicitudes que tardaron al menos %{threshold} ms, con la proporción de base de datos, vistas, hooks de plugins y recolección de basura. Las sentencias SQL se guardan sin sus valores. Los datos con más de %{days} días se borran."
  text_expert_metrics_performance_off: "Las métricas de rendimiento están desactivadas (opción del plugin «Registrar métricas de rendimiento»): la página muestra lo que se registró mientras estaban activadas."
  text_expert_metrics_slow_requests_not_migrated: "Falta la migración del plugin: ejecute rake redmine:plugins:migrate para guardar las solicitudes lentas."
  label_expert_metrics_slow_by_action: "Por controlador y acción"
  label_expert_metrics_slow_latest: "Últimas solicitudes lentas (como máximo %{count})"
  label_expert_metrics_details: "Detalles"
  label_expert_metrics_slowest_sql: "Sentencias SQL más lentas"
  label_expert_metrics_frequent_sql: "Sentencias SQL más frecuentes"
  label_expert_metrics_sql_runs: "%{count}× desde la base de datos, %{cached}× desde la caché de consultas, %{ms} ms en total"
  label_expert_metrics_hook_times: "Listeners de hooks más lentos"
  label_expert_metrics_sql_counts: "%{count} sentencias SQL, %{cached} desde la caché de consultas"
  field_expert_metrics_action: "Controlador#acción"
  field_expert_metrics_avg_ms: "Media (ms)"
  field_expert_metrics_max_ms: "Máximo (ms)"
  field_expert_metrics_avg_db_ms: "Media de base de datos (ms)"
  field_expert_metrics_avg_sql: "Media de sentencias SQL"
  field_expert_metrics_time: "Hora"
  field_expert_metrics_path: "Ruta"
  field_expert_metrics_status: "Estado"
  field_expert_metrics_duration_ms: "Total (ms)"
  field_expert_metrics_db_ms: "Base de datos (ms, sentencias)"
  field_expert_metrics_view_ms: "Vistas (ms)"
  field_expert_metrics_hooks_ms: "Hooks (ms)"
  field_expert_metrics_gc_ms: "GC (ms)"
