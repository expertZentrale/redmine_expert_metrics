pt-BR:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Usuários ativos"
  text_expert_metrics_intro: "Usuários que enviaram pelo menos uma requisição nos últimos %{minutes} minutos. A lista se baseia nos tokens de sessão do Redmine, portanto requisições com chave de API e a busca de e-mails não contam – elas aparecem em Uso da API. Consulte-a antes de uma manutenção para ver se alguém ainda está trabalhando."
  label_expert_metrics_active_last: "Ativos nos últimos %{window}"
  label_expert_metrics_sessions_total: "Sessões conectadas"
  label_expert_metrics_recent_logins: "Logins nas últimas 24 h"
  label_expert_metrics_collected_at: "Atualizado em"
  label_expert_metrics_refresh: "Atualizar"
  label_expert_metrics_prometheus: "Métricas do Prometheus"
  field_expert_metrics_last_activity: "Última atividade"
  field_expert_metrics_session_since: "Conectado desde"
  field_expert_metrics_sessions: "Sessões"
  label_expert_metrics_minutes_ago:
    zero: "agora mesmo"
    one: "há 1 min"
    other: "há %{count} min"
  label_expert_metrics_api_usage: "Uso da API"
  text_expert_metrics_api_usage_intro: "Requisições autenticadas por credenciais de API (chave de API, HTTP Basic, OAuth), por usuário. O próprio Redmine não registra isso; o plugin as conta por dia, verbo HTTP e cliente (User-Agent) e guarda o último endereço IP e o último caminho. Dados com mais de %{days} dias são excluídos."
  text_expert_metrics_api_disabled: "A API REST está desativada (Administração » Configurações » API), portanto nenhuma requisição de API é aceita ou registrada."
  text_expert_metrics_api_not_migrated: "Migração do plugin pendente – execute rake redmine:plugins:migrate para registrar o uso da API."
  label_expert_metrics_api_period: "Período"
  label_expert_metrics_api_days:
    one: "hoje"
    other: "%{count} dias"
  label_expert_metrics_api_users: "Usuários com requisições de API"
  label_expert_metrics_api_requests: "Requisições de API"
  label_expert_metrics_api_writes: "Das quais de escrita (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Usuários com chave de API"
  label_expert_metrics_unused_keys: "Chaves de API não usadas neste período (requisições com senha e OAuth não usam a chave)"
  label_expert_metrics_time_ago: "há %{time}"
  label_expert_metrics_no_user_agent: "(sem User-Agent)"
  label_expert_metrics_more_clients:
    one: "mais 1 cliente"
    other: "mais %{count} clientes"
  label_expert_metrics_switched_to: "como %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "Chave de API"
  label_expert_metrics_auth_key_hint: "Cabeçalho X-Redmine-API-Key ou parâmetro key"
  label_expert_metrics_auth_basic: "Chave de API (Basic)"
  label_expert_metrics_auth_basic_hint: "Chave de API como nome de usuário do HTTP Basic"
  label_expert_metrics_auth_password: "Senha"
  label_expert_metrics_auth_password_hint: "Login e senha via HTTP Basic – o script armazena uma senha; prefira uma chave de API"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "Token de acesso OAuth"
  field_expert_metrics_last_used: "Último uso"
  field_expert_metrics_requests: "Requisições"
  field_expert_metrics_writes: "Escrita"
  field_expert_metrics_auth: "Autenticação"
  field_expert_metrics_clients: "Clientes"
  field_expert_metrics_last_ip: "Último IP"
  field_expert_metrics_last_path: "Último caminho"
  field_expert_metrics_key_created_on: "Chave de API criada"
  label_expert_metrics_api_usage_enabled: "Registrar uso da API"
  text_expert_metrics_api_usage_enabled: "Registra cada requisição autenticada por credenciais de API (diariamente por usuário, método, autenticação e cliente, com o último endereço IP e o último caminho; mantido por 90 dias) e adiciona as séries de API a /metrics. Desativado: nenhuma escrita extra no banco de dados por requisição de API e nenhuma consulta de API em /metrics."
  text_expert_metrics_api_usage_off: "O registro está desativado (configuração do plugin “Registrar uso da API”) – a página mostra o que foi registrado enquanto ele estava ativado."
  label_expert_metrics_performance_enabled: "Registrar métricas de desempenho"
  text_expert_metrics_performance_enabled: "Mede o tempo de cada requisição por controller e ação (banco de dados, views, hooks de plugin, instruções SQL), dos jobs em segundo plano e da memória e coleta de lixo de cada processo do Redmine, e adiciona essas séries a /metrics. Elas ficam na memória de cada processo, então o Prometheus precisa coletar de cada pod e os dashboards as somam com sum. Os administradores também recebem um cabeçalho Server-Timing para ler nas ferramentas de desenvolvedor do navegador. Desativado: nenhum trabalho extra por requisição."
  label_expert_metrics_slow_request_threshold: "Limite para requisições lentas"
  text_expert_metrics_slow_request_threshold: "Requisições que levam pelo menos esse tempo são armazenadas com seu detalhamento (instruções SQL mais lentas, sem os valores, e listeners de hook mais lentos) e listadas em Requisições lentas; mantidas por %{days} dias, no máximo 30 por processo e minuto. 0 armazena todas as requisições – somente para medições curtas."
  label_expert_metrics_slow_requests: "Requisições lentas"
  text_expert_metrics_slow_requests_intro: "Requisições que levaram pelo menos %{threshold} ms, com a parcela de banco de dados, views, hooks de plugin e coleta de lixo. As instruções SQL são armazenadas sem seus valores. Dados com mais de %{days} dias são excluídos."
  text_expert_metrics_performance_off: "As métricas de desempenho estão desativadas (configuração do plugin “Registrar métricas de desempenho”) – a página mostra o que foi registrado enquanto estavam ativadas."
  text_expert_metrics_slow_requests_not_migrated: "Migração do plugin pendente – execute rake redmine:plugins:migrate para armazenar requisições lentas."
  label_expert_metrics_slow_by_action: "Por controller e ação"
  label_expert_metrics_slow_latest: "Requisições lentas mais recentes (no máximo %{count})"
  label_expert_metrics_details: "Detalhes"
  label_expert_metrics_slowest_sql: "Instruções SQL mais lentas"
  label_expert_metrics_hook_times: "Listeners de hook mais lentos"
  label_expert_metrics_sql_counts: "%{count} instruções SQL, %{cached} do cache de consultas"
