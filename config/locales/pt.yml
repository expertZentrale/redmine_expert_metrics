pt:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Utilizadores ativos"
  text_expert_metrics_intro: "Utilizadores que enviaram pelo menos um pedido nos últimos %{minutes} minutos. A lista baseia-se nos tokens de sessão do Redmine, pelo que os pedidos com chave de API e a recolha de e-mails não contam - esses aparecem em Utilização da API. Consulte-a antes de uma manutenção para ver se ainda há alguém a trabalhar."
  label_expert_metrics_active_last: "Ativos nos últimos %{window}"
  label_expert_metrics_sessions_total: "Sessões iniciadas"
  label_expert_metrics_recent_logins: "Inícios de sessão nas últimas 24 h"
  label_expert_metrics_collected_at: "Atualizado em"
  label_expert_metrics_refresh: "Atualizar"
  label_expert_metrics_prometheus: "Métricas Prometheus"
  field_expert_metrics_last_activity: "Última atividade"
  field_expert_metrics_session_since: "Sessão iniciada desde"
  field_expert_metrics_sessions: "Sessões"
  label_expert_metrics_minutes_ago:
    zero: "agora mesmo"
    one: "há 1 min"
    other: "há %{count} min"
  label_expert_metrics_api_usage: "Utilização da API"
  text_expert_metrics_api_usage_intro: "Pedidos autenticados com credenciais de API (chave de API, HTTP Basic, OAuth), por utilizador. O próprio Redmine não regista isto; a extensão conta-os por dia, verbo HTTP e cliente (User-Agent) e guarda o último endereço IP e o último caminho. Os dados com mais de %{days} dias são apagados."
  text_expert_metrics_api_disabled: "A API REST está desativada (Administração » Configurações » API), pelo que nenhum pedido de API é aceite nem registado."
  text_expert_metrics_api_not_migrated: "Falta a migração da extensão - execute rake redmine:plugins:migrate para registar a utilização da API."
  label_expert_metrics_api_period: "Período"
  label_expert_metrics_api_days:
    one: "hoje"
    other: "%{count} dias"
  label_expert_metrics_api_users: "Utilizadores com pedidos de API"
  label_expert_metrics_api_requests: "Pedidos de API"
  label_expert_metrics_api_writes: "Dos quais de escrita (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Utilizadores com chave de API"
  label_expert_metrics_unused_keys: "Chaves de API não usadas neste período (os pedidos com palavra-passe e OAuth não usam a chave)"
  label_expert_metrics_time_ago: "há %{time}"
  label_expert_metrics_no_user_agent: "(sem User-Agent)"
  label_expert_metrics_more_clients:
    one: "mais 1 cliente"
    other: "mais %{count} clientes"
  label_expert_metrics_switched_to: "como %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "Chave de API"
  label_expert_metrics_auth_key_hint: "Cabeçalho X-Redmine-API-Key ou parâmetro key"
  label_expert_metrics_auth_basic: "Chave de API (Basic)"
  label_expert_metrics_auth_basic_hint: "Chave de API como nome de utilizador HTTP Basic"
  label_expert_metrics_auth_password: "Palavra-passe"
  label_expert_metrics_auth_password_hint: "Nome de utilizador e palavra-passe via HTTP Basic - o script guarda uma palavra-passe; prefira uma chave de API"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "Token de acesso OAuth"
  field_expert_metrics_last_used: "Última utilização"
  field_expert_metrics_requests: "Pedidos"
  field_expert_metrics_writes: "Escrita"
  field_expert_metrics_auth: "Autenticação"
  field_expert_metrics_clients: "Clientes"
  field_expert_metrics_last_ip: "Último IP"
  field_expert_metrics_last_path: "Último caminho"
  field_expert_metrics_key_created_on: "Chave de API criada"
  label_expert_metrics_api_usage_enabled: "Registar utilização da API"
  text_expert_metrics_api_usage_enabled: "Regista cada pedido autenticado com credenciais de API (diariamente por utilizador, método, autenticação e cliente, com o último endereço IP e caminho; guardado durante 90 dias) e adiciona as séries da API a /metrics. Desligado: sem escritas adicionais na base de dados por pedido de API e sem consultas de API em /metrics."
  text_expert_metrics_api_usage_off: "O registo está desligado (configuração da extensão «Registar utilização da API») - a página mostra o que foi registado enquanto esteve ligado."
  label_expert_metrics_performance_enabled: "Registar métricas de desempenho"
  text_expert_metrics_performance_enabled: "Mede o tempo de cada pedido por controlador e ação (base de dados, vistas, hooks de extensões, instruções SQL), dos trabalhos em segundo plano e da memória e recolha de lixo de cada processo do Redmine, e adiciona estas séries a /metrics. São mantidas na memória de cada processo, pelo que o Prometheus tem de recolher dados de cada pod e os dashboards somam-nas com sum. Os administradores recebem também um cabeçalho Server-Timing para consultar nas ferramentas de programador do navegador. Desligado: sem trabalho adicional por pedido."
  label_expert_metrics_slow_request_threshold: "Limiar de pedido lento"
  text_expert_metrics_slow_request_threshold: "Os pedidos que demorem pelo menos este tempo são guardados com a respetiva decomposição (instruções SQL mais lentas sem valores, listeners de hooks mais lentos) e listados em Pedidos lentos; guardados durante %{days} dias, no máximo 30 por processo e minuto. 0 guarda todos os pedidos - apenas para medições curtas."
  label_expert_metrics_slow_requests: "Pedidos lentos"
  text_expert_metrics_slow_requests_intro: "Pedidos que demoraram pelo menos %{threshold} ms, com a parte da base de dados, das vistas, dos hooks de extensões e da recolha de lixo. As instruções SQL são guardadas sem os seus valores. Os dados com mais de %{days} dias são apagados."
  text_expert_metrics_performance_off: "As métricas de desempenho estão desligadas (configuração da extensão «Registar métricas de desempenho») - a página mostra o que foi registado enquanto estiveram ligadas."
  text_expert_metrics_slow_requests_not_migrated: "Falta a migração da extensão - execute rake redmine:plugins:migrate para guardar os pedidos lentos."
  label_expert_metrics_slow_by_action: "Por controlador e ação"
  label_expert_metrics_slow_latest: "Pedidos lentos mais recentes (no máximo %{count})"
  label_expert_metrics_details: "Detalhes"
  label_expert_metrics_slowest_sql: "Instruções SQL mais lentas"
  label_expert_metrics_hook_times: "Listeners de hooks mais lentos"
  label_expert_metrics_sql_counts: "%{count} instruções SQL, %{cached} da cache de consultas"
  field_expert_metrics_action: "Controlador#ação"
  field_expert_metrics_avg_ms: "Média (ms)"
  field_expert_metrics_max_ms: "Máximo (ms)"
  field_expert_metrics_avg_db_ms: "Média da base de dados (ms)"
  field_expert_metrics_avg_sql: "Média de instruções SQL"
  field_expert_metrics_time: "Data/hora"
  field_expert_metrics_path: "Caminho"
  field_expert_metrics_status: "Estado"
