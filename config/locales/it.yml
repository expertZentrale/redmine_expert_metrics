it:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Utenti attivi"
  text_expert_metrics_intro: "Utenti che hanno inviato almeno una richiesta negli ultimi %{minutes} minuti. L'elenco si basa sui token di sessione di Redmine, quindi le richieste con chiave API e il recupero delle email non vengono conteggiati: sono elencati in Utilizzo API. Controllalo prima di una manutenzione per vedere se qualcuno sta ancora lavorando."
  label_expert_metrics_active_last: "Attivi negli ultimi %{window}"
  label_expert_metrics_sessions_total: "Sessioni con accesso"
  label_expert_metrics_recent_logins: "Accessi nelle ultime 24 h"
  label_expert_metrics_collected_at: "Aggiornato al"
  label_expert_metrics_refresh: "Aggiorna"
  label_expert_metrics_prometheus: "Metriche Prometheus"
  field_expert_metrics_last_activity: "Ultima attività"
  field_expert_metrics_session_since: "Connesso dal"
  field_expert_metrics_sessions: "Sessioni"
  label_expert_metrics_minutes_ago:
    zero: "proprio ora"
    one: "1 min fa"
    other: "%{count} min fa"
  label_expert_metrics_api_usage: "Utilizzo API"
  text_expert_metrics_api_usage_intro: "Richieste autenticate con credenziali API (chiave API, HTTP Basic, OAuth), per utente. Redmine stesso non ne tiene traccia; il plugin le conta per giorno, metodo HTTP e client (User-Agent) e conserva l'ultimo indirizzo IP e l'ultimo percorso. I dati più vecchi di %{days} giorni vengono eliminati."
  text_expert_metrics_api_disabled: "L'API REST è disattivata (Amministrazione » Impostazioni » API), quindi nessuna richiesta API viene accettata o registrata."
  text_expert_metrics_api_not_migrated: "Migrazione del plugin mancante: esegui rake redmine:plugins:migrate per registrare l'utilizzo API."
  label_expert_metrics_api_period: "Periodo"
  label_expert_metrics_api_days:
    one: "oggi"
    other: "%{count} giorni"
  label_expert_metrics_api_users: "Utenti con richieste API"
  label_expert_metrics_api_requests: "Richieste API"
  label_expert_metrics_api_writes: "Di cui in scrittura (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Utenti con una chiave API"
  label_expert_metrics_unused_keys: "Chiavi API non usate in questo periodo (le richieste con password e OAuth non usano la chiave)"
  label_expert_metrics_time_ago: "%{time} fa"
  label_expert_metrics_no_user_agent: "(nessun User-Agent)"
  label_expert_metrics_more_clients:
    one: "1 altro client"
    other: "altri %{count} client"
  label_expert_metrics_switched_to: "come %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "Chiave API"
  label_expert_metrics_auth_key_hint: "Intestazione X-Redmine-API-Key o parametro key"
  label_expert_metrics_auth_basic: "Chiave API (Basic)"
  label_expert_metrics_auth_basic_hint: "Chiave API come nome utente HTTP Basic"
  label_expert_metrics_auth_password: "Password"
  label_expert_metrics_auth_password_hint: "Login e password tramite HTTP Basic: lo script salva una password; meglio usare una chiave API"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "Token di accesso OAuth"
  field_expert_metrics_last_used: "Ultimo utilizzo"
  field_expert_metrics_requests: "Richieste"
  field_expert_metrics_writes: "In scrittura"
  field_expert_metrics_auth: "Autenticazione"
  field_expert_metrics_clients: "Client"
  field_expert_metrics_last_ip: "Ultimo IP"
  field_expert_metrics_last_path: "Ultimo percorso"
  field_expert_metrics_key_created_on: "Chiave API creata"
  label_expert_metrics_api_usage_enabled: "Registra l'utilizzo API"
  text_expert_metrics_api_usage_enabled: "Registra ogni richiesta autenticata con credenziali API (al giorno per utente, metodo, autenticazione e client, con ultimo indirizzo IP e percorso; conservata 90 giorni) e aggiunge le serie API a /metrics. Disattivato: nessuna scrittura aggiuntiva nel database per richiesta API e nessuna query API su /metrics."
  text_expert_metrics_api_usage_off: "La registrazione è disattivata (impostazione del plugin «Registra l'utilizzo API»): la pagina mostra ciò che è stato registrato mentre era attiva."
  label_expert_metrics_performance_enabled: "Registra le metriche di prestazione"
  text_expert_metrics_performance_enabled: "Misura i tempi di ogni richiesta per controller e azione (database, viste, hook dei plugin, istruzioni SQL), dei job in background e la memoria e la garbage collection di ogni processo Redmine, e aggiunge queste serie a /metrics. Vengono conservate nella memoria di ciascun processo, quindi Prometheus deve interrogare ogni pod e le dashboard le sommano con sum. Gli amministratori ricevono anche un'intestazione Server-Timing da leggere negli strumenti per sviluppatori del browser. Disattivato: nessun lavoro aggiuntivo per richiesta."
  label_expert_metrics_slow_request_threshold: "Soglia richieste lente"
  text_expert_metrics_slow_request_threshold: "Le richieste che durano almeno questo tempo vengono salvate con la loro scomposizione (istruzioni SQL più lente senza i valori, listener degli hook più lenti) ed elencate in Richieste lente; conservate %{days} giorni, al massimo 30 per processo e minuto. 0 salva ogni richiesta: solo per misurazioni brevi."
  label_expert_metrics_slow_requests: "Richieste lente"
  text_expert_metrics_slow_requests_intro: "Richieste che hanno impiegato almeno %{threshold} ms, con la quota di database, viste, hook dei plugin e garbage collection. Le istruzioni SQL vengono salvate senza i loro valori. I dati più vecchi di %{days} giorni vengono eliminati."
  text_expert_metrics_performance_off: "Le metriche di prestazione sono disattivate (impostazione del plugin «Registra le metriche di prestazione»): la pagina mostra ciò che è stato registrato mentre erano attive."
  text_expert_metrics_slow_requests_not_migrated: "Migrazione del plugin mancante: esegui rake redmine:plugins:migrate per salvare le richieste lente."
  label_expert_metrics_slow_by_action: "Per controller e azione"
  label_expert_metrics_slow_latest: "Ultime richieste lente (al massimo %{count})"
  label_expert_metrics_details: "Dettagli"
  label_expert_metrics_slowest_sql: "Istruzioni SQL più lente"
  label_expert_metrics_frequent_sql: "Istruzioni SQL più frequenti"
  label_expert_metrics_sql_runs: "%{count}× dal database, %{cached}× dalla cache delle query, %{ms} ms in totale"
  label_expert_metrics_hook_times: "Listener degli hook più lenti"
  label_expert_metrics_sql_counts: "%{count} istruzioni SQL, %{cached} dalla cache delle query"
