  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Aktive Benutzer"
  text_expert_metrics_intro: "Benutzer, die in den letzten %{minutes} Minuten mindestens eine Anfrage gesendet haben. Grundlage sind die Sitzungs-Token von Redmine, API-Key-Zugriffe und der Mailabruf zählen nicht mit - diese stehen unter API-Nutzung. Vor Wartungsarbeiten hier nachsehen, ob noch jemand arbeitet."
  label_expert_metrics_active_last: "Aktiv in den letzten %{window}"
