de:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Aktive Benutzer"
  text_expert_metrics_intro: "Benutzer, die in den letzten %{minutes} Minuten mindestens eine Anfrage gesendet haben. Grundlage sind die Sitzungs-Token von Redmine, API-Key-Zugriffe und der Mailabruf zählen nicht mit - diese stehen unter API-Nutzung. Vor Wartungsarbeiten hier nachsehen, ob noch jemand arbeitet."
  label_expert_metrics_active_last: "Aktiv in den letzten %{window}"
  label_expert_metrics_sessions_total: "Angemeldete Sitzungen"
  label_expert_metrics_recent_logins: "Anmeldungen in den letzten 24 h"
  label_expert_metrics_collected_at: "Stand"
  label_expert_metrics_refresh: "Aktualisieren"
  label_expert_metrics_prometheus: "Prometheus-Metriken"
  field_expert_metrics_last_activity: "Letzte Aktivität"
  field_expert_metrics_session_since: "Angemeldet seit"
  field_expert_metrics_sessions: "Sitzungen"
  label_expert_metrics_minutes_ago:
    zero: "gerade eben"
    one: "vor 1 Min."
    other: "vor %{count} Min."
  label_expert_metrics_api_usage: "API-Nutzung"
  text_expert_metrics_api_usage_intro: "Anfragen, die mit API-Zugangsdaten (API-Schlüssel, HTTP Basic, OAuth) angemeldet wurden, je Benutzer. Redmine selbst protokolliert das nicht; das Plugin zählt sie pro Tag, HTTP-Methode und Client (User-Agent) und merkt sich die letzte IP-Adresse und den letzten Pfad. Daten, die älter als %{days} Tage sind, werden gelöscht."
  text_expert_metrics_api_disabled: "Die REST-API ist deaktiviert (Administration » Konfiguration » API), es werden also keine API-Anfragen angenommen oder erfasst."
  text_expert_metrics_api_not_migrated: "Plugin-Migration fehlt - rake redmine:plugins:migrate ausführen, um die API-Nutzung zu erfassen."
  label_expert_metrics_api_period: "Zeitraum"
  label_expert_metrics_api_days:
    one: "heute"
    other: "%{count} Tage"
  label_expert_metrics_api_users: "Benutzer mit API-Anfragen"
  label_expert_metrics_api_requests: "API-Anfragen"
  label_expert_metrics_api_writes: "Davon schreibend (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Benutzer mit API-Schlüssel"
  label_expert_metrics_unused_keys: "API-Schlüssel, die in diesem Zeitraum nicht verwendet wurden (Passwort- und OAuth-Anfragen verwenden den Schlüssel nicht)"
  label_expert_metrics_time_ago: "vor %{time}"
  label_expert_metrics_no_user_agent: "(kein User-Agent)"
  label_expert_metrics_more_clients:
    one: "1 weiterer Client"
    other: "%{count} weitere Clients"
  label_expert_metrics_switched_to: "als %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "API-Schlüssel"
  label_expert_metrics_auth_key_hint: "Header X-Redmine-API-Key oder Parameter key"
  label_expert_metrics_auth_basic: "API-Schlüssel (Basic)"
  label_expert_metrics_auth_basic_hint: "API-Schlüssel als HTTP-Basic-Benutzername"
  label_expert_metrics_auth_password: "Passwort"
  label_expert_metrics_auth_password_hint: "Login und Passwort per HTTP Basic - das Skript speichert ein Passwort; besser einen API-Schlüssel verwenden"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "OAuth-Access-Token"
  field_expert_metrics_last_used: "Zuletzt verwendet"
  field_expert_metrics_requests: "Anfragen"
  field_expert_metrics_writes: "Schreibend"
  field_expert_metrics_auth: "Anmeldung"
  field_expert_metrics_clients: "Clients"
  field_expert_metrics_last_ip: "Letzte IP"
  field_expert_metrics_last_path: "Letzter Pfad"
  field_expert_metrics_key_created_on: "API-Schlüssel erstellt"
  label_expert_metrics_api_usage_enabled: "API-Nutzung erfassen"
  text_expert_metrics_api_usage_enabled: "Erfasst jede mit API-Zugangsdaten angemeldete Anfrage (pro Tag, Benutzer, Methode, Anmeldeart und Client, mit letzter IP-Adresse und letztem Pfad; 90 Tage aufbewahrt) und ergänzt /metrics um die API-Reihen. Aus: keine zusätzlichen Datenbankschreibzugriffe pro API-Anfrage und keine API-Abfragen in /metrics."
  text_expert_metrics_api_usage_off: "Die Erfassung ist ausgeschaltet (Plugin-Einstellung \"API-Nutzung erfassen\") - die Seite zeigt, was erfasst wurde, solange sie eingeschaltet war."
  label_expert_metrics_performance_enabled: "Performance-Metriken erfassen"
  text_expert_metrics_performance_enabled: "Misst jede Anfrage je Controller und Aktion (Datenbank, Ansichten, Plugin-Hooks, SQL-Anweisungen), Hintergrundjobs sowie Speicher und Garbage Collection jedes Redmine-Prozesses und ergänzt /metrics um diese Reihen. Sie liegen im Speicher des jeweiligen Prozesses, Prometheus muss also jeden Pod abfragen, und Dashboards addieren sie mit sum. Administratoren erhalten zusätzlich einen Server-Timing-Header für die Entwicklerwerkzeuge des Browsers. Aus: kein Mehraufwand pro Anfrage."
  label_expert_metrics_slow_request_threshold: "Schwelle für langsame Anfragen"
  text_expert_metrics_slow_request_threshold: "Anfragen, die mindestens so lange dauern, werden mit ihrer Aufschlüsselung gespeichert (langsamste SQL-Anweisungen ohne Werte, langsamste Hook-Listener) und unter Langsame Anfragen aufgeführt; %{days} Tage aufbewahrt, höchstens 30 pro Prozess und Minute. 0 speichert jede Anfrage - nur für kurze Messungen."
  label_expert_metrics_slow_requests: "Langsame Anfragen"
  text_expert_metrics_slow_requests_intro: "Anfragen, die mindestens %{threshold} ms gedauert haben, mit dem Anteil von Datenbank, Ansichten, Plugin-Hooks und Garbage Collection. Die SQL-Anweisungen werden ohne ihre Werte gespeichert. Daten, die älter als %{days} Tage sind, werden gelöscht."
  text_expert_metrics_performance_off: "Die Performance-Metriken sind ausgeschaltet (Plugin-Einstellung \"Performance-Metriken erfassen\") - die Seite zeigt, was erfasst wurde, solange sie eingeschaltet waren."
  text_expert_metrics_slow_requests_not_migrated: "Plugin-Migration fehlt - rake redmine:plugins:migrate ausführen, um langsame Anfragen zu speichern."
  label_expert_metrics_slow_by_action: "Nach Controller und Aktion"
  label_expert_metrics_slow_latest: "Neueste langsame Anfragen (höchstens %{count})"
  label_expert_metrics_details: "Details"
  label_expert_metrics_slowest_sql: "Langsamste SQL-Anweisungen"
  label_expert_metrics_hook_times: "Langsamste Hook-Listener"
  label_expert_metrics_sql_counts: "%{count} SQL-Anweisungen, %{cached} aus dem Query-Cache"
  field_expert_metrics_action: "Controller#Aktion"
  field_expert_metrics_avg_ms: "Durchschnitt (ms)"
  field_expert_metrics_max_ms: "Maximum (ms)"
  field_expert_metrics_avg_db_ms: "Durchschnitt Datenbank (ms)"
  field_expert_metrics_avg_sql: "Durchschnitt SQL-Anweisungen"
  field_expert_metrics_time: "Zeitpunkt"
  field_expert_metrics_path: "Pfad"
  field_expert_metrics_status: "Status"
  field_expert_metrics_duration_ms: "Gesamt (ms)"
  field_expert_metrics_db_ms: "Datenbank (ms, Anweisungen)"
  field_expert_metrics_view_ms: "Ansichten (ms)"
  field_expert_metrics_hooks_ms: "Hooks (ms)"
  field_expert_metrics_gc_ms: "GC (ms)"
