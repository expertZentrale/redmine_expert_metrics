fr:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Utilisateurs actifs"
  text_expert_metrics_intro: "Utilisateurs ayant envoyé au moins une requête au cours des %{minutes} dernières minutes. La liste repose sur les jetons de session de Redmine : les requêtes par clé API et la récupération des e-mails ne sont donc pas comptées – elles figurent sous Utilisation de l'API. Consultez-la avant une maintenance pour savoir si quelqu'un travaille encore."
  label_expert_metrics_active_last: "Actifs au cours des dernières %{window}"
  label_expert_metrics_sessions_total: "Sessions connectées"
  label_expert_metrics_recent_logins: "Connexions des dernières 24 h"
  label_expert_metrics_collected_at: "État au"
  label_expert_metrics_refresh: "Actualiser"
  label_expert_metrics_prometheus: "Métriques Prometheus"
  field_expert_metrics_last_activity: "Dernière activité"
  field_expert_metrics_session_since: "Connecté depuis"
  field_expert_metrics_sessions: "Sessions"
  label_expert_metrics_minutes_ago:
    zero: "à l'instant"
    one: "il y a 1 min"
    other: "il y a %{count} min"
  label_expert_metrics_api_usage: "Utilisation de l'API"
  text_expert_metrics_api_usage_intro: "Requêtes authentifiées par des identifiants API (clé API, HTTP Basic, OAuth), par utilisateur. Redmine lui-même n'en garde aucune trace ; le plugin les compte par jour, verbe HTTP et client (User-Agent) et conserve la dernière adresse IP et le dernier chemin. Les données de plus de %{days} jours sont supprimées."
  text_expert_metrics_api_disabled: "L'API REST est désactivée (Administration » Configuration » API) : aucune requête API n'est donc acceptée ni enregistrée."
  text_expert_metrics_api_not_migrated: "Migration du plugin manquante – exécutez rake redmine:plugins:migrate pour enregistrer l'utilisation de l'API."
  label_expert_metrics_api_period: "Période"
  label_expert_metrics_api_days:
    one: "aujourd'hui"
    other: "%{count} jours"
  label_expert_metrics_api_users: "Utilisateurs avec requêtes API"
  label_expert_metrics_api_requests: "Requêtes API"
  label_expert_metrics_api_writes: "Dont en écriture (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Utilisateurs avec une clé API"
  label_expert_metrics_unused_keys: "Clés API non utilisées sur cette période (les requêtes par mot de passe et OAuth n'utilisent pas la clé)"
  label_expert_metrics_time_ago: "il y a %{time}"
  label_expert_metrics_no_user_agent: "(pas de User-Agent)"
  label_expert_metrics_more_clients:
    one: "1 autre client"
    other: "%{count} autres clients"
  label_expert_metrics_switched_to: "en tant que %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "Clé API"
  label_expert_metrics_auth_key_hint: "En-tête X-Redmine-API-Key ou paramètre key"
  label_expert_metrics_auth_basic: "Clé API (Basic)"
  label_expert_metrics_auth_basic_hint: "Clé API comme nom d'utilisateur HTTP Basic"
  label_expert_metrics_auth_password: "Mot de passe"
  label_expert_metrics_auth_password_hint: "Identifiant et mot de passe via HTTP Basic – le script stocke un mot de passe ; préférez une clé API"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "Jeton d'accès OAuth"
  field_expert_metrics_last_used: "Dernière utilisation"
  field_expert_metrics_requests: "Requêtes"
  field_expert_metrics_writes: "Écriture"
  field_expert_metrics_auth: "Authentification"
  field_expert_metrics_clients: "Clients"
  field_expert_metrics_last_ip: "Dernière IP"
  field_expert_metrics_last_path: "Dernier chemin"
  field_expert_metrics_key_created_on: "Clé API créée"
  label_expert_metrics_api_usage_enabled: "Enregistrer l'utilisation de l'API"
  text_expert_metrics_api_usage_enabled: "Enregistre chaque requête authentifiée par des identifiants API (par jour, utilisateur, méthode, type d'authentification et client, avec la dernière adresse IP et le dernier chemin ; conservées 90 jours) et ajoute les séries API à /metrics. Désactivé : aucune écriture supplémentaire en base de données par requête API et aucune interrogation des données API sur /metrics."
  text_expert_metrics_api_usage_off: "L'enregistrement est désactivé (paramètre du plugin « Enregistrer l'utilisation de l'API ») – la page affiche ce qui a été enregistré lorsqu'il était activé."
  label_expert_metrics_performance_enabled: "Enregistrer les métriques de performance"
  text_expert_metrics_performance_enabled: "Mesure la durée de chaque requête par contrôleur et action (base de données, vues, hooks de plugins, instructions SQL), des tâches d'arrière-plan ainsi que la mémoire et le ramasse-miettes (garbage collection) de chaque processus Redmine, et ajoute ces séries à /metrics. Elles sont conservées dans la mémoire de chaque processus : Prometheus doit donc interroger chaque pod, et les tableaux de bord les additionnent avec sum. Les administrateurs reçoivent en outre un en-tête Server-Timing consultable dans les outils de développement du navigateur. Désactivé : aucun travail supplémentaire par requête."
  label_expert_metrics_slow_request_threshold: "Seuil des requêtes lentes"
  text_expert_metrics_slow_request_threshold: "Les requêtes qui durent au moins aussi longtemps sont stockées avec leur détail (instructions SQL les plus lentes, sans leurs valeurs, et écouteurs de hooks les plus lents) et listées sous Requêtes lentes ; conservées %{days} jours, au maximum 30 par processus et par minute. 0 stocke toutes les requêtes – uniquement pour de courtes mesures."
  label_expert_metrics_slow_requests: "Requêtes lentes"
  text_expert_metrics_slow_requests_intro: "Requêtes ayant duré au moins %{threshold} ms, avec la part de la base de données, des vues, des hooks de plugins et du ramasse-miettes. Les instructions SQL sont stockées sans leurs valeurs. Les données de plus de %{days} jours sont supprimées."
  text_expert_metrics_performance_off: "Les métriques de performance sont désactivées (paramètre du plugin « Enregistrer les métriques de performance ») – la page affiche ce qui a été enregistré lorsqu'elles étaient activées."
  text_expert_metrics_slow_requests_not_migrated: "Migration du plugin manquante – exécutez rake redmine:plugins:migrate pour stocker les requêtes lentes."
  label_expert_metrics_slow_by_action: "Par contrôleur et action"
  label_expert_metrics_slow_latest: "Dernières requêtes lentes (%{count} au maximum)"
  label_expert_metrics_details: "Détails"
  label_expert_metrics_slowest_sql: "Instructions SQL les plus lentes"
  label_expert_metrics_hook_times: "Écouteurs de hooks les plus lents"
  label_expert_metrics_sql_counts: "%{count} instructions SQL, dont %{cached} depuis le cache de requêtes"
  field_expert_metrics_action: "Contrôleur#action"
  field_expert_metrics_avg_ms: "Moyenne (ms)"
  field_expert_metrics_max_ms: "Maximum (ms)"
  field_expert_metrics_avg_db_ms: "Moyenne base de données (ms)"
  field_expert_metrics_avg_sql: "Moyenne instructions SQL"
  field_expert_metrics_time: "Heure"
  field_expert_metrics_path: "Chemin"
  field_expert_metrics_status: "Statut"
  field_expert_metrics_duration_ms: "Total (ms)"
  field_expert_metrics_db_ms: "Base de données (ms, instructions)"
  field_expert_metrics_view_ms: "Vues (ms)"
  field_expert_metrics_hooks_ms: "Hooks (ms)"
  field_expert_metrics_gc_ms: "GC (ms)"
  field_expert_metrics_host: "Hôte"
