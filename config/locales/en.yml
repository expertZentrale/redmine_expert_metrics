en:
  label_expert_metrics: "expert Metrics"
  label_expert_metrics_active_users: "Active users"
  text_expert_metrics_intro: "Users that sent at least one request in the last %{minutes} minutes. The list is based on Redmine's session tokens, so API-key requests and mail fetching do not count - those are listed under API usage. Check it before maintenance to see whether anybody is still working."
  label_expert_metrics_active_last: "Active in the last %{window}"
  label_expert_metrics_sessions_total: "Logged-in sessions"
  label_expert_metrics_recent_logins: "Logins in the last 24 h"
  label_expert_metrics_collected_at: "As of"
  label_expert_metrics_refresh: "Refresh"
  label_expert_metrics_prometheus: "Prometheus metrics"
  field_expert_metrics_last_activity: "Last activity"
  field_expert_metrics_session_since: "Logged in since"
  field_expert_metrics_sessions: "Sessions"
  label_expert_metrics_minutes_ago:
    zero: "just now"
    one: "1 min ago"
    other: "%{count} min ago"
  label_expert_metrics_api_usage: "API usage"
  text_expert_metrics_api_usage_intro: "Requests authenticated by API credentials (API key, HTTP Basic, OAuth), per user. Redmine itself keeps no record of this; the plugin counts them per day, HTTP verb and client (User-Agent) and keeps the last IP address and path. Data older than %{days} days is deleted."
  text_expert_metrics_api_disabled: "The REST API is disabled (Administration » Settings » API), so no API requests are accepted or recorded."
  text_expert_metrics_api_not_migrated: "Plugin migration missing - run rake redmine:plugins:migrate to record API usage."
  label_expert_metrics_api_period: "Period"
  label_expert_metrics_api_days:
    one: "today"
    other: "%{count} days"
  label_expert_metrics_api_users: "Users with API requests"
  label_expert_metrics_api_requests: "API requests"
  label_expert_metrics_api_writes: "Of which writing (POST, PUT, PATCH, DELETE)"
  label_expert_metrics_api_keys: "Users with an API key"
  label_expert_metrics_unused_keys: "API keys not used in this period (password and OAuth requests do not use the key)"
  label_expert_metrics_time_ago: "%{time} ago"
  label_expert_metrics_no_user_agent: "(no User-Agent)"
  label_expert_metrics_more_clients:
    one: "1 more client"
    other: "%{count} more clients"
  label_expert_metrics_switched_to: "as %{login} (X-Redmine-Switch-User)"
  label_expert_metrics_auth_key: "API key"
  label_expert_metrics_auth_key_hint: "X-Redmine-API-Key header or key parameter"
  label_expert_metrics_auth_basic: "API key (Basic)"
  label_expert_metrics_auth_basic_hint: "API key as HTTP Basic user name"
  label_expert_metrics_auth_password: "Password"
  label_expert_metrics_auth_password_hint: "Login and password via HTTP Basic - the script stores a password; prefer an API key"
  label_expert_metrics_auth_oauth: "OAuth"
  label_expert_metrics_auth_oauth_hint: "OAuth access token"
  field_expert_metrics_last_used: "Last used"
  field_expert_metrics_requests: "Requests"
  field_expert_metrics_writes: "Writing"
  field_expert_metrics_auth: "Authentication"
  field_expert_metrics_clients: "Clients"
  field_expert_metrics_last_ip: "Last IP"
  field_expert_metrics_last_path: "Last path"
  field_expert_metrics_key_created_on: "API key created"
  label_expert_metrics_api_usage_enabled: "Record API usage"
  text_expert_metrics_api_usage_enabled: "Records every request authenticated by API credentials (daily per user, method, authentication and client, with last IP address and path; kept 90 days) and adds the API series to /metrics. Off: no extra database writes per API request and no API queries on /metrics."
  text_expert_metrics_api_usage_off: "Recording is switched off (plugin setting \"Record API usage\") - the page shows what was recorded while it was on."
  label_expert_metrics_performance_enabled: "Record performance metrics"
  text_expert_metrics_performance_enabled: "Times every request per controller and action (database, views, plugin hooks, SQL statements), background jobs and the memory and garbage collection of each Redmine process, and adds these series to /metrics. They are kept in the memory of each process, so Prometheus has to scrape every pod and dashboards add them up with sum. Admins also get a Server-Timing header to read in the browser's developer tools. Off: no extra work per request."
  label_expert_metrics_slow_request_threshold: "Slow request threshold"
  text_expert_metrics_slow_request_threshold: "Requests that take at least this long are stored with their breakdown (slowest SQL statements with values removed, slowest hook listeners) and listed under Slow requests; kept %{days} days, at most 30 per process and minute. 0 stores every request - only for short measurements."
  label_expert_metrics_slow_requests: "Slow requests"
  text_expert_metrics_slow_requests_intro: "Requests that took at least %{threshold} ms, with the share of database, views, plugin hooks and garbage collection. The SQL statements are stored without their values. Data older than %{days} days is deleted."
  text_expert_metrics_performance_off: "Performance metrics are switched off (plugin setting \"Record performance metrics\") - the page shows what was recorded while they were on."
  text_expert_metrics_slow_requests_not_migrated: "Plugin migration missing - run rake redmine:plugins:migrate to store slow requests."
  label_expert_metrics_slow_by_action: "By controller and action"
  label_expert_metrics_slow_latest: "Latest slow requests (at most %{count})"
  label_expert_metrics_details: "Details"
  label_expert_metrics_slowest_sql: "Slowest SQL statements"
  label_expert_metrics_hook_times: "Slowest hook listeners"
  label_expert_metrics_sql_counts: "%{count} SQL statements, %{cached} from the query cache"
  field_expert_metrics_action: "Controller#action"
  field_expert_metrics_avg_ms: "Average (ms)"
  field_expert_metrics_max_ms: "Maximum (ms)"
  field_expert_metrics_avg_db_ms: "Average database (ms)"
  field_expert_metrics_avg_sql: "Average SQL statements"
  field_expert_metrics_time: "Time"
  field_expert_metrics_path: "Path"
  field_expert_metrics_status: "Status"
  field_expert_metrics_duration_ms: "Total (ms)"
  field_expert_metrics_db_ms: "Database (ms, statements)"
  field_expert_metrics_view_ms: "Views (ms)"
  field_expert_metrics_hooks_ms: "Hooks (ms)"
  field_expert_metrics_gc_ms: "GC (ms)"
  field_expert_metrics_host: "Host"
